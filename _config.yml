title: Rasmus Kampmann
tagline: Operations systems for seed and agriculture companies
description: Know what to produce, stock and sell next season. Custom operations systems for seed and agriculture companies, built on Excel and the Microsoft tools you already use.
baseurl: ""
url: "https://rasmuskampmann.com"

author:
  name: Rasmus Kampmann
  email: rasmus.kampmann@hotmail.com
  linkedin: https://www.linkedin.com/in/rasmuskampmann/
  github: https://github.com/rasmuskampmann1998
  location: Odense, Denmark

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - cv
  - scripts
  - UPDATE_BRIEF.md
