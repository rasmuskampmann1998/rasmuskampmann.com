title: Rasmus Kampmann
tagline: Freelance Power BI Consultant
description: Freelance Power BI Developer, Power Platform Consultant and Data Analyst in Odense, Denmark. Business systems that combine data, apps and AI for supply chain and agri-food companies, on Power BI, Power Apps, Azure SQL and Python.
baseurl: ""
url: "https://rasmuskampmann.com"

author:
  name: Rasmus Kampmann
  email: info@rasmuskampmann.com
  linkedin: https://www.linkedin.com/in/rasmuskampmann/
  github: https://github.com/rasmuskampmann1998
  location: Odense, Denmark

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - cv
